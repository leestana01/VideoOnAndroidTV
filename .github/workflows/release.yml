name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Restore release signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          umask 077
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > keystore.properties
      - name: Build signed APK only
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify, name, and checksum artifact
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          OUT="Vela-Player-${GITHUB_REF_NAME#v}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signing-verification.txt
          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -1)
          test -n "$CERT_SHA256"
          cp "docs/releases/${GITHUB_REF_NAME#v}.md" release-notes.md
          printf '\n## Signing certificate\n\nSHA-256: `%s`\n' "$CERT_SHA256" >> release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            Vela-Player-*.apk
            Vela-Player-*.apk.sha256
            signing-verification.txt

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Create disposable CI signing key
        run: |
          keytool -genkeypair -keystore ci-release.jks -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI"
          printf 'storeFile=ci-release.jks\nstorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' > keystore.properties
      - name: Android lint
        run: ./gradlew lintDebug --stacktrace || { cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt; exit 1; }
      - name: Test and assemble
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Upload minified release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minified-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  minimum-api-launch:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minified-release-apk
          path: artifacts
      - name: Generate seek fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i color=c=black:s=320x180:r=25 \
            -f lavfi -i sine=frequency=440:sample_rate=44100 \
            -t 30 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -movflags +faststart seek-fixture.mp4
      - name: Enable KVM acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and prove launcher on API 21
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 21
          target: default
          arch: x86
          profile: Nexus 7
          sdcard-path-or-size: 100M
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install artifacts/app-release.apk
            adb logcat -c
            adb shell am start -n com.leestana.videoontv/.MainActivity
            sleep 5
            adb shell ps | grep 'com.leestana.videoontv' || { adb logcat -d -t 200; exit 1; }
            adb shell dumpsys activity top | grep 'ACTIVITY com.leestana.videoontv/.MainActivity' || { adb logcat -d -t 200; exit 1; }
            adb push seek-fixture.mp4 /sdcard/Download/seek-fixture.mp4
            adb logcat -c
            adb shell am start -W -a android.intent.action.VIEW -c android.intent.category.DEFAULT -t video/mp4 -d 'content://com.leestana.videoontv.files/external/Download/seek-fixture.mp4' -f 0x00000001 com.leestana.videoontv
            sleep 7
            adb shell input keyevent 90
            sleep 3
            adb logcat -d | tee device.log
            grep 'VelaSeek' device.log | tee seek.log
            grep -q 'request originMs=' seek.log
            test "$(sed -n 's/.*settled positionMs=\([0-9][0-9]*\).*/\1/p' seek.log | tail -1)" -ge 8000 || { adb logcat -d -t 300; exit 1; }
            adb shell am force-stop com.leestana.videoontv
            adb shell am start -n com.leestana.videoontv/.MainActivity
            sleep 3
            adb shell ps | grep 'com.leestana.videoontv' || { adb logcat -d -t 200; exit 1; }
            adb shell dumpsys activity top | grep 'ACTIVITY com.leestana.videoontv/.MainActivity' || { adb logcat -d -t 200; exit 1; }

  aggregate:
    if: always()
    needs: [build, minimum-api-launch]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all release gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.minimum-api-launch.result }}
        run: test "$BUILD_RESULT" = success -a "$DEVICE_RESULT" = success

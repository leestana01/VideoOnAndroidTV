name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
      - name: Create disposable CI signing key
        run: |
          keytool -genkeypair -keystore ci-release.jks -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI"
          printf 'storeFile=ci-release.jks\nstorePassword=android\nkeyAlias=ci\nkeyPassword=android\n' > keystore.properties
      - name: Lint, test, and assemble
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Upload minified release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: minified-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 1

  minimum-api-launch:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: minified-release-apk
          path: artifacts
      - name: Install and prove launcher on API 21
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 21
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          script: |
            adb install artifacts/app-release.apk
            adb shell am start -W -n com.leestana.videoontv/.MainActivity
            sleep 5
            adb shell pidof com.leestana.videoontv
            adb shell am force-stop com.leestana.videoontv
            adb shell am start -W -n com.leestana.videoontv/.MainActivity
            sleep 3
            adb shell pidof com.leestana.videoontv

  aggregate:
    if: always()
    needs: [build, minimum-api-launch]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all release gates
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.minimum-api-launch.result }}
        run: test "$BUILD_RESULT" = success -a "$DEVICE_RESULT" = success
